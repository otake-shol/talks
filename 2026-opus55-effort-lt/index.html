<img src="assets/effort-definition-docs.png" alt="Claude Codeの公式説明。effortはadaptive reasoningを制御し、各ステップで考えるか・どれだけ考えるかをタスクの複雑さに応じてモデルが決める。低いと単純な作業で速く安く、高いと複雑な問題で深く考える。" style="width:1136px;height:auto;max-height:104px;object-fit:contain;object-position:left;margin:0 0 4px;" />
<p class="annotation">公式：作業の難しさを見て、考えるか・どれだけ考えるかをモデルが決める</p>
<div class="split reverse"><div class="visual">
<svg viewBox="0 0 520 300" width="440" height="254" role="img" aria-label="effortをつまみに見立てた図。半円の目盛りに左からlow、medium、high、xhigh、max。針はOpus 5.5の既定のmediumを指す。左端は速く・安く、右端は深く考える。">

<h3 id="%E4%BD%8E%E3%81%8F%E3%81%99%E3%82%8B%E3%81%A8">低くすると</h3>
<p>単純な作業を速く、安く</p>
<p><small>例：名前の変更、たたき台づくり</small></p>
<h3 id="%E9%AB%98%E3%81%8F%E3%81%99%E3%82%8B%E3%81%A8">高くすると</h3>
<p>複雑な問題を深く考える</p>
<p><small>例：既存コードのバグ修正。時間とトークンは増える</small></p>

<h1 id="claudeai%E3%81%AF%E3%83%A2%E3%83%87%E3%83%AB%E5%90%8D%E3%81%AE%E4%B8%AD%E3%81%AE%E3%82%A8%E3%83%95%E3%82%A9%E3%83%BC%E3%83%88">claude.aiはモデル名の中の「エフォート」</h1>
<img src="assets/claudeai-effort-menu.png" alt="claude.aiのチャット入力欄。送信ボタン横の「Opus 5.5 中」を開くとモデル一覧の下に「エフォート 中」があり、そのサブメニューに低・中（おすすめ）・高・超高・最大（5.5×以上の使用量）が並ぶ。説明文は「より高い労力は、より徹底的な回答を意味しますが、時間がかかり、制限をより速く消費します。」" style="width:auto;height:auto;max-width:1136px;max-height:420px;object-fit:contain;object-position:left;margin:0 0 8px;" />
<p class="annotation">低・中・高・超高・最大＝low・medium・high・xhigh・max</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="l10" data-theme="story-slides" data-lang="ja" lang="ja" class="l10" data-marpit-pagination="6" style="--paginate:true;--class:l10;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E3%83%87%E3%82%B9%E3%82%AF%E3%83%88%E3%83%83%E3%83%97%E3%82%A2%E3%83%97%E3%83%AA%E3%81%AEcode%E3%82%82%E5%90%8C%E3%81%98%E3%83%A1%E3%83%8B%E3%83%A5%E3%83%BC">デスクトップアプリのCodeも同じメニュー</h1>
<img src="assets/desktop-effort-menu.png" alt="ClaudeデスクトップアプリのCodeタブ。入力欄の右下「Opus 5.5 中」を開くと「モデル・このセッション」の一覧の下に「エフォート 中」があり、サブメニューに低・中（おすすめ）・高・超高・最大（3.5×以上の使用量）とUltracodeのスイッチが並ぶ。" style="width:auto;height:auto;max-width:1136px;max-height:420px;object-fit:contain;object-position:left;margin:0 0 8px;" />
<p class="annotation">入力欄の右下「Opus 5.5 中」から。⌘⇧Eでエフォートを直接開ける</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="l10" data-theme="story-slides" data-lang="ja" lang="ja" class="l10" data-marpit-pagination="7" style="--paginate:true;--class:l10;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E3%82%BF%E3%83%BC%E3%83%9F%E3%83%8A%E3%83%AB%E3%81%AEclaude-code%E3%81%AF-effort-%E3%81%A7%E9%81%B8%E3%81%B6">ターミナルのClaude Codeは /effort で選ぶ</h1>
<img src="assets/cli-effort-footer.png" alt="ターミナルのClaude Code 2.1.314の画面下。右下に「◐ medium · /effort」と今のeffortが表示されている。" style="width:1000px;height:auto;max-height:120px;object-fit:contain;object-position:left;margin:0 0 8px;" />
<img src="assets/cli-effort-slider.png" alt="/effortを実行した画面。Faster〜Smarterのスライダーにlow・medium・high・xhigh・maxが並び、mediumが選ばれている。右にUltracode off。下に「←/→ to adjust · Enter to confirm · s for this session only · Esc to cancel」。" style="width:900px;height:auto;max-height:270px;object-fit:contain;object-position:left;margin:0 0 8px;" />
<p class="annotation">右下に今の段階。/effort でスライダーが開き、←→で選ぶ</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="l05" data-footer="出典：[effortの段階の公式説明](https://code.claude.com/docs/en/model-config#choose-an-effort-level)・[公式リリースノート](https://platform.claude.com/docs/en/release-notes/overview)" data-theme="story-slides" data-lang="ja" lang="ja" class="l05" data-marpit-pagination="8" style="--paginate:true;--class:l05;--footer:出典：[effortの段階の公式説明](https://code.claude.com/docs/en/model-config#choose-an-effort-level)・[公式リリースノート](https://platform.claude.com/docs/en/release-notes/overview);--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="effort%E3%81%AF%E8%80%83%E3%81%88%E3%82%8B%E6%B7%B1%E3%81%95%E3%81%AE5%E6%AE%B5%E9%9A%8Eopus-55%E3%81%A7%E6%97%A2%E5%AE%9A%E3%81%8Cmedium%E3%81%AB">effortは考える深さの5段階。Opus 5.5で既定がmediumに</h1>
<ol class="rail">
<li><b>low</b><span>短いやり取り</span></li>
<li class="active"><b>medium</b><span>Opus 5.5の既定</span></li>
<li><b>high</b><span>従来の既定</span></li>
<li><b>xhigh</b><span>より深く</span></li>
<li><b>max</b><span>最も深い推論</span></li>
</ol>
<p class="band">9/22公開のOpus 5.5で既定が1段下がった</p>
<footer>出典：<a href="https://code.claude.com/docs/en/model-config#choose-an-effort-level">effortの段階の公式説明</a>・<a href="https://platform.claude.com/docs/en/release-notes/overview">公式リリースノート</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="l14" data-theme="story-slides" data-lang="ja" lang="ja" class="l14" data-marpit-pagination="9" style="--paginate:true;--class:l14;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E3%81%8A%E9%87%91%E3%82%92%E6%B0%97%E3%81%AB%E3%81%97%E3%81%AA%E3%81%8F%E3%81%A6%E8%89%AF%E3%81%84%E3%81%AA%E3%82%89br%E5%85%A8%E9%83%A8max%E3%81%A7%E3%82%88%E3%81%8F%E3%81%AA%E3%81%84">お金を気にしなくて良いなら、<br />全部maxでよくない？</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="l10" data-footer="出典：[effortの公式説明](https://code.claude.com/docs/en/model-config#choose-an-effort-level)・[Opus 5.5の推奨設定](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5)" data-theme="story-slides" data-lang="ja" lang="ja" class="l10" data-marpit-pagination="10" style="--paginate:true;--class:l10;--footer:出典：[effortの公式説明](https://code.claude.com/docs/en/model-config#choose-an-effort-level)・[Opus 5.5の推奨設定](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5);--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E5%85%AC%E5%BC%8F%E3%81%AFmax%E3%81%AF%E5%BA%83%E3%81%8F%E4%BD%BF%E3%81%86%E5%89%8D%E3%81%AB%E8%A9%A6%E3%81%97%E3%81%A6">公式は「maxは広く使う前に試して」</h1>
<img src="assets/effort-max-docs.png" alt="公式ドキュメントのmaxの行。難問向けだが、改善が逓減し考えすぎやすいので、広く採用する前に試すよう書かれている。" style="width:1136px;height:auto;max-height:100px;object-fit:contain;object-position:left;margin:0 0 4px;" />
<p class="annotation">max：難問向け。ただし改善は頭打ちになりやすく、考えすぎる。広く使う前に試す</p>
<img src="assets/effort-medium-docs.png" alt="公式ドキュメントのmediumの行。Opus 5.5とSonnet 5.5の既定で、範囲の明確な日々の開発作業に合う。" style="width:1136px;height:auto;max-height:118px;object-fit:contain;object-position:left;margin:8px 0 4px;" />
<p class="annotation">medium：Opus 5.5の既定。範囲の明確な日々の開発作業向け</p>
<p class="band">だから一度、maxを既定にして試すことにした</p>
<footer>出典：<a href="https://code.claude.com/docs/en/model-config#choose-an-effort-level">effortの公式説明</a>・<a href="https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5">Opus 5.5の推奨設定</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="l14" data-theme="story-slides" data-lang="ja" lang="ja" class="l14" data-marpit-pagination="11" style="--paginate:true;--class:l14;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E3%81%93%E3%81%93%E3%81%8B%E3%82%89%E3%81%AF%E3%82%BF%E3%83%BC%E3%83%9F%E3%83%8A%E3%83%ABcli%E3%81%AE%E8%A9%B1">ここからはターミナル（CLI）の話</h1>
<p>僕は普段、Claude Codeをターミナルで使っている</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-jELEprXC="" data-paginate="true" data-class="l06" data-footer="出典：[effortの設定方法の公式説明](https://code.claude.com/docs/en/model-config#adjust-effort-level)" data-theme="story-slides" data-lang="ja" lang="ja" class="l06" data-marpit-pagination="12" style="--paginate:true;--class:l06;--footer:出典：[effortの設定方法の公式説明](https://code.claude.com/docs/en/model-config#adjust-effort-level);--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="effort%E3%81%AE%E9%81%B8%E3%81%B3%E6%96%B9%E3%81%AF4%E9%80%9A%E3%82%8Aenter%E3%81%AA%E3%82%89%E6%AC%A1%E5%9B%9E%E3%82%82%E4%BF%9D%E5%AD%98">effortの選び方は4通り、Enterなら次回も保存</h1>

<table>
<thead>
<tr>
<th>方法</th>
<th>操作</th>
<th>効く範囲</th>
</tr>
</thead>
<tbody>
<tr>
<td>/effort</td>
<td>段階名を打つ／スライダーでEnter</td>
<td>次回も残る</td>
</tr>
<tr>
<td><strong>/model</strong></td>
<td><strong>一覧の下で←→、Enter</strong></td>
<td><strong>次回も残る</strong></td>
</tr>
<tr>
<td>起動時</td>
<td><code>claude --effort high</code></td>
<td>その起動だけ</td>
</tr>
<tr>
<td>環境変数</td>
<td><code>CLAUDE_CODE_EFFORT_LEVEL=high</code></td>
<td>変数を渡した起動</td>
</tr>
</tbody>
</table>
<p class="annotation">僕がよく使うのは /model。モデルとeffortを1画面で選べる</p>
<p class="annotation">Enterキーなら保存、sキーならこのセッションだけ</p>
<footer>出典：<a href="https://code.claude.com/docs/en/model-config#adjust-effort-level">effortの設定方法の公式説明</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="l02" data-theme="story-slides" data-lang="ja" lang="ja" class="l02" data-marpit-pagination="13" style="--paginate:true;--class:l02;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li class="active">きっかけ</li><li>ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="model%E3%81%A7max%E3%82%92%E9%81%B8%E3%81%B3enter%E3%81%A7%E6%97%A2%E5%AE%9A%E3%81%AB%E8%A8%AD%E5%AE%9A">/modelでMaxを選び、「Enterで既定に設定」</h1>
<img src="assets/term-picker.png" alt="Claude Code 2.1.288の/model画面。Default (recommended) が選ばれ、Max effortが表示され、フッターに Enter to set as default · s to use this session only · Esc to cancel とある。" style="width:1136px;height:auto;max-height:330px;object-fit:contain;object-position:left;margin:4px 0 12px;" />
<p class="annotation">「Your pick becomes the default for new sessions」「Enter to set as default」。迷わずEnter</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="l10" data-theme="story-slides" data-lang="ja" lang="ja" class="l10" data-marpit-pagination="14" style="--paginate:true;--class:l10;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li>きっかけ</li><li class="active">ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E6%97%A2%E5%AE%9A%E3%81%AB%E4%BF%9D%E5%AD%98%E3%81%97%E3%81%9Fmax%E3%81%8C%E5%86%8D%E8%B5%B7%E5%8B%95%E3%81%A7medium%E3%81%AB">「既定に保存」したmaxが再起動でmediumに</h1>
<p class="annotation">Enter直後：「新規セッションの既定に保存した」と表示。右下のステータスは max</p>
<img src="assets/term-after-enter.png" alt="Claude Code 2.1.288の画面。/modelの直後にSet model to Opus 5.5 (default) and saved as your default for new sessions with max effortと表示され、ステータスバーはmax。" style="width:1136px;height:auto;max-height:190px;object-fit:contain;object-position:left;margin:4px 0 16px;" />
<p class="annotation">同じ設定のまま再起動：ステータスは medium</p>
<img src="assets/term-new-session.png" alt="同じ設定で再起動した画面。ステータスバーはmedium。" style="width:1136px;height:auto;max-height:122px;object-fit:contain;object-position:left;margin:4px 0 0;" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="l06" data-theme="story-slides" data-lang="ja" lang="ja" class="l06" data-marpit-pagination="15" style="--paginate:true;--class:l06;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li>きっかけ</li><li class="active">ハマり</li><li>切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E5%90%8C%E3%81%98max%E3%81%A7%E3%82%82model%E3%81%A8effort%E3%81%A7%E8%AA%AC%E6%98%8E%E3%81%8C%E9%A3%9F%E3%81%84%E9%81%95%E3%81%86">同じmaxでも/modelと/effortで説明が食い違う</h1>
<div class="contrast"><div>
<h3 id="model%E3%81%A7max%E3%82%92%E9%81%B8%E3%81%B6">/modelでMaxを選ぶ</h3>
<p><code>saved as your default for new sessions with max effort</code></p>
<p>「既定に保存した」と表示</p>
</div><div class="hl">
<h3 id="effort-max%E3%82%92%E6%89%93%E3%81%A4">/effort maxを打つ</h3>
<p><code>Set effort level to max (this session only)</code></p>
<p>「このセッションだけ」と表示</p>
</div></div>
<p class="band">settings.jsonは {} のまま。保存されたのはモデルだけ</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="l10" data-footer="出典：[issue #35904のCollaborator回答](https://github.com/anthropics/claude-code/issues/35904)（2026-08-20 JST）" data-theme="story-slides" data-lang="ja" lang="ja" class="l10" data-marpit-pagination="16" style="--paginate:true;--class:l10;--footer:出典：[issue #35904のCollaborator回答](https://github.com/anthropics/claude-code/issues/35904)（2026-08-20 JST）;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li>きっかけ</li><li>ハマり</li><li class="active">切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E6%97%A2%E5%AD%98issue%E3%81%8C%E7%A4%BA%E3%81%97%E3%81%9Fmax%E3%81%AF%E3%82%BB%E3%83%83%E3%82%B7%E3%83%A7%E3%83%B3%E9%99%90%E3%82%8A">既存issueが示した「maxはセッション限り」</h1>
<img src="assets/issue-35904-reply.png" alt="issue #35904へのCollaborator bchernyの回答。effortLevelのmaxは無視されるが、maxは意図的にセッション限りなので仕様であり、設定キーはlow・medium・high・xhighを受け付けると説明。" style="width:1136px;height:auto;max-height:206px;object-fit:contain;object-position:left;margin:4px 0 16px;" />
<p class="annotation">Claude Codeチームの回答：バグではなく意図した動作。maxはわざとセッション限り</p>
<p class="annotation">#35904は2026年3月の報告。8人がコメントし、👍は22件</p>
<footer>出典：<a href="https://github.com/anthropics/claude-code/issues/35904">issue #35904のCollaborator回答</a>（2026-08-20 JST）</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-IPsXOCJQ="" data-paginate="true" data-class="l08" data-theme="story-slides" data-lang="ja" lang="ja" class="l08" data-marpit-pagination="17" style="--paginate:true;--class:l08;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li>きっかけ</li><li>ハマり</li><li class="active">切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E4%BD%BF%E3%81%84%E6%8D%A8%E3%81%A6%E3%81%AE%E8%A8%AD%E5%AE%9A%E3%81%A7%E8%AA%B0%E3%81%A7%E3%82%82%E8%B5%B7%E3%81%8D%E3%82%8B%E3%81%A8%E5%86%8D%E7%8F%BE">使い捨ての設定で誰でも起きると再現</h1>
<ol class="steps">
<li><b>空の設定で起動</b><span>設定フォルダを<br />一時フォルダに</span></li>
<li><b>Maxを選んでEnter</b><span>「既定に保存」と<br />表示される</span></li>
<li><b>設定を確認</b><span>settings.jsonは<br />空のまま</span></li>
<li><b>同じ設定で再起動</b><span>ステータスは<br />mediumに戻る</span></li>
</ol>
<pre><code class="language-shell"><span class="hljs-meta prompt_">$ </span><span class="language-bash"><span class="hljs-built_in">export</span> CLAUDE_CONFIG_DIR=$(<span class="hljs-built_in">mktemp</span> -d) &amp;&amp; claude</span>
❯ /model    # Max effort → Enter「saved as your default…」
<span class="hljs-meta prompt_">$ </span><span class="language-bash"><span class="hljs-built_in">cat</span> <span class="hljs-string">&quot;<span class="hljs-variable">$CLAUDE_CONFIG_DIR</span>/settings.json&quot;</span></span>
{}
</code></pre>
<p class="band">当時最新の2.1.288、ログインなしでも同じ結果</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="l14" data-theme="story-slides" data-lang="ja" lang="ja" class="l14" data-marpit-pagination="18" style="--paginate:true;--class:l14;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li>きっかけ</li><li>ハマり</li><li class="active">切り分け</li><li>報告と修正</li></ol></header>
<h1 id="%E3%81%A4%E3%81%BE%E3%82%8A%E4%BF%9D%E5%AD%98%E3%81%97%E3%81%9F%E3%81%AE%E8%A1%A8%E7%A4%BA%E3%81%8C%E5%98%98%E3%82%84%E3%82%93">つまり「保存した」の表示が嘘やん</h1>
<p>保存されないのは仕様。間違っていたのは画面の説明のほう</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="l06" data-footer="出典：[issue #99350](https://github.com/anthropics/claude-code/issues/99350)（2026-10-04投稿）" data-theme="story-slides" data-lang="ja" lang="ja" class="l06" data-marpit-pagination="19" style="--paginate:true;--class:l06;--footer:出典：[issue #99350](https://github.com/anthropics/claude-code/issues/99350)（2026-10-04投稿）;--theme:story-slides;--lang:ja;" data-marpit-pagination-total="24" data-size="16:9"><header class="n01"><ol><li>きっかけ</li><li>ハマり</li><li>切り分け</li><li class="active">報告と修正</li></ol></header>

<div class="contrast"><div>
<h3 id="%E3%81%84%E3%81%BE%E3%81%AE%E8%A1%A8%E7%A4%BA">いまの表示</h3>
<p><code>…saved as your default for new sessions with max effort</code></p>
<p>maxも保存されたと読める</p>
</div><div class="hl">
<h3 id="%E6%8F%90%E6%A1%88%E3%81%97%E3%81%9F%E8%A1%A8%E7%A4%BA">提案した表示</h3>
<p><code>…saved as your default for new sessions · max effort for this session only</code></p>
<p>保存したものとセッション限りを分ける</p>
</div></div>
<p class="band">直してほしい1点に絞り、既存issueとの違いも明記</p>
<footer>出典：<a href="https://github.com/anthropics/claude-code/issues/99350">issue #99350</a>（2026-10-04投稿）</footer>

 * Marp の HTML スライドに「発表者のページ位置を聴衆のスマホへ同期する」機能を足すランタイム。
 *
 * - 発表者: URL に ?live=present を付けて開く。ページを送るたびに位置を中継サーバへ送る。
 *           q キーで聴衆向け QR コードを全画面表示する。
 * - 聴衆:   普通に URL を開くだけ。発表者のページへ自動で追従する。
 *           自分でページを送ると追従を止め、「発表者のページへ戻る」ボタンを出す。
 *
 * 中継は ntfy.sh（登録不要の pub/sub）。Marp の HTML は URL の #番号 でページを切り替えるので、
 * 受け取った番号を location.hash に書くだけで同期できる。
 *
 * 設定は inject.mjs が window.LIVE_SYNC に埋め込む: { server, topic, publicUrl, qrSvg }
 */
(() => {
  const config = window.LIVE_SYNC;
  if (!config || !config.topic) return;

  const params = new URLSearchParams(location.search);
  // Marp の発表者ビュー（?view=presenter）と次ページのプレビュー（?view=next）では動かさない。
  // 元のウィンドウもページが連動するので、送信はそこからの1か所だけにする（重複送信の防止）
  if (params.has("view")) return;
  const isPresenter = params.get("live") === "present";
  const endpoint = `${config.server.replace(/\/$/, "")}/${encodeURIComponent(config.topic)}`;
  /** これより古い位置情報は「今は発表中ではない」とみなす */
  const STALE_MS = 2 * 60 * 1000;
  const HEARTBEAT_MS = 30 * 1000;

  /**
   * 現在のページ番号（1始まり）を URL のハッシュから読む。
   * @returns {number}
   */
  const currentPage = () => {
    const n = Number.parseInt(location.hash.slice(1), 10);
    return Number.isFinite(n) && n > 0 ? n : 1;
  };

  /**
   * ページが変わったら呼ぶ。Marp はページ送りで hashchange を出さずに URL を書き換えるので、
   * hashchange に加えて短い間隔で URL を見に行く。
   * @param {(page: number) => void} callback
   */
  const onPageChange = (callback) => {
    let last = currentPage();
    const check = () => {
      const page = currentPage();
      if (page === last) return;
      last = page;
      callback(page);
    };
    window.addEventListener("hashchange", check);
    setInterval(check, 200);
  };

  /** スライドの総枚数（範囲外の番号を弾くのに使う） */
  const totalPages = () => document.querySelectorAll("svg[data-marpit-svg]").length || Infinity;

  const style = document.createElement("style");
  style.textContent = `
    .ls-badge{position:fixed;left:12px;bottom:12px;z-index:2147483000;display:flex;gap:8px;align-items:center;
      font:600 13px/1 system-ui,-apple-system,sans-serif;color:#fff;background:rgba(20,20,20,.72);
      padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px);pointer-events:none;transition:opacity .3s}
    .ls-dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}
    .ls-on .ls-dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.3)}
    .ls-hidden{opacity:0}
    .ls-top{top:12px;bottom:auto}
    .ls-return{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2147483001;
      font:700 15px/1 system-ui,-apple-system,sans-serif;color:#fff;background:#2563eb;border:0;
      padding:14px 20px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
    .ls-qr{position:fixed;inset:0;z-index:2147483002;display:flex;flex-direction:column;gap:24px;
      align-items:center;justify-content:center;background:rgba(255,255,255,.97);
      font:700 clamp(18px,3vw,36px)/1.4 system-ui,-apple-system,sans-serif;color:#111}
    .ls-qr svg{width:min(60vh,60vw);height:auto}
    .ls-qr small{font-weight:500;font-size:.55em;color:#555}
  `;
  document.head.appendChild(style);

  const badge = document.createElement("div");
  badge.className = "ls-badge ls-hidden";
  badge.innerHTML = '<span class="ls-dot"></span><span class="ls-text"></span>';
  document.body.appendChild(badge);

  /**
   * 左下のバッジ表示を切り替える。
   * @param {string} text
   * @param {boolean} on 赤い点を点けるか
   */
  const setBadge = (text, on) => {
    badge.querySelector(".ls-text").textContent = text;
    badge.classList.toggle("ls-on", on);
    badge.classList.remove("ls-hidden");
  };

  isPresenter ? startPresenter() : startAudience();

  /** 発表者モード: ページ位置を送信し、q キーで QR を出す */
  function startPresenter() {
    let timer;

    const publish = () => {
      fetch(endpoint, {
        method: "POST",
        body: JSON.stringify({ s: currentPage() }),
      })
        .then((res) => {
          if (!res.ok) throw new Error(String(res.status));
          setBadge(`LIVE 配信中 ${currentPage()}`, true);
        })
        .catch(() => {
          setBadge("LIVE 送信失敗（再試行します）", false);
        });
    };
    // 連打でページを送ったときは最後の位置だけ送る
    const schedule = (delay = 250) => {
      clearTimeout(timer);
      timer = setTimeout(publish, delay);
    };

    onPageChange(() => schedule());
    setInterval(() => schedule(0), HEARTBEAT_MS);
    schedule(0);

    if (config.qrSvg) {
      const overlay = document.createElement("div");
      overlay.className = "ls-qr";
      overlay.hidden = true;
      overlay.innerHTML = `${config.qrSvg}<div>スマホで読み取ると、発表中のページに自動で追従します</div><small>${config.publicUrl}</small>`;
      document.body.appendChild(overlay);
      overlay.addEventListener("click", () => (overlay.hidden = true));
      window.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "q" && !e.metaKey && !e.ctrlKey && !e.altKey) {
            overlay.hidden = !overlay.hidden;
            e.stopPropagation();
          } else if (e.key === "Escape" && !overlay.hidden) {
            overlay.hidden = true;
            e.stopPropagation();
          }
        },
        true,
      );
    }
  }

  /** 聴衆モード: 発表者の位置を購読して追従する */
  function startAudience() {
    let following = true;
    let livePage = null;
    let lastSeen = 0;
    /** 自分で移動させた先のページ。ページ変化が自分由来か利用者の操作かを見分ける */
    let expectedPage = null;

    badge.classList.add("ls-top"); // 下は「戻る」ボタンの場所にする
    const returnButton = document.createElement("button");
    returnButton.className = "ls-return";
    returnButton.hidden = true;
    document.body.appendChild(returnButton);

    const isLive = () => Date.now() - lastSeen < STALE_MS;

    const render = () => {
      if (!isLive() || livePage == null) {
        badge.classList.add("ls-hidden");
        returnButton.hidden = true;
        return;
      }
      setBadge(following ? "LIVE 発表に追従中" : "LIVE 自由閲覧中", following);
      returnButton.hidden = following || currentPage() === livePage;
      returnButton.textContent = `発表中の${livePage}枚目へ戻る`;
    };

    const goTo = (page) => {
      if (currentPage() === page) return;
      expectedPage = page;
      location.hash = `#${page}`;
    };

    onPageChange((page) => {
      if (page === expectedPage) {
        expectedPage = null;
      } else if (isLive()) {
        // 利用者が自分でページを送った → 追従を止める（発表者と同じページに来たら再開）
        following = page === livePage;
      }
      render();
    });

    returnButton.addEventListener("click", () => {
      following = true;
      if (livePage != null) goTo(livePage);
      render();
    });

    // 鮮度は中継サーバの時刻どうしで比べる（発表者と聴衆の端末の時計ズレに左右されないため）
    let serverOpenedAt = 0;
    const source = new EventSource(`${endpoint}/sse?since=latest`);
    source.addEventListener("message", (event) => {
      let envelope;
      let payload;
      try {
        envelope = JSON.parse(event.data);
        if (envelope.event === "open") {
          serverOpenedAt = envelope.time * 1000;
          return;
        }
        payload = JSON.parse(envelope.message);
      } catch {
        return;
      }
      const page = Number(payload?.s);
      if (!Number.isInteger(page) || page < 1 || page > totalPages()) return;
      if (serverOpenedAt - envelope.time * 1000 > STALE_MS) return; // 発表終了後に残った古い位置

      lastSeen = Date.now();
      livePage = page;
      if (following) goTo(page);
      render();
    });

    // 発表が止まったらバッジを消す
    setInterval(render, 10 * 1000);
  }
})();

":"CHANGELOG","aliases":[],"desc":"ソフトの版ごとに、何を変えて何を直したかを並べた記録。"},{"term":"リリースノート","aliases":[],"desc":"新しい機能やモデルの公開を知らせる公式のお知らせ。"}];</script><script>/**
 * 聴衆向けの用語解説。今のページに出てくる専門用語に点線の下線を引き、
 * 右上の「用語」ボタンか下線をタップすると解説を下から出す。
 *
 * 用語集は inject.mjs が window.SLIDE_GLOSSARY に埋め込む: [{ term, aliases, desc }]
 * 発表者モード（?live=present）と Marp の発表者ビュー（?view=...）では動かさない（スクリーンに出さない）。
 */
(() => {
  const glossary = window.SLIDE_GLOSSARY;
  if (!Array.isArray(glossary) || glossary.length === 0) return;
  const params = new URLSearchParams(location.search);
  if (params.has("view") || params.get("live") === "present") return;

  const slides = [...document.querySelectorAll("svg[data-marpit-svg] > foreignObject > section")];
  if (slides.length === 0) return;

  /** 表記ゆれ（別名）から用語の番号を引く。英数字は大文字小文字を区別しない */
  const indexByName = new Map();
  for (const [i, entry] of glossary.entries()) {
    for (const name of [entry.term, ...(entry.aliases ?? [])]) indexByName.set(name.toLowerCase(), i);
  }
  const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // 長い表記から先に当てる（「Claude Code」を「Claude」より優先）。英数字の語は単語の途中では当てない
  const pattern = new RegExp(
    [...indexByName.keys()]
      .sort((a, b) => b.length - a.length)
      .map((name) => {
        const body = escape(name);
        const head = /^[a-z0-9_]/i.test(name) ? "(?<![A-Za-z0-9_])" : "";
        const tail = /[a-z0-9_]$/i.test(name) ? "(?![A-Za-z0-9_])" : "";
        return head + body + tail;
      })
      .join("|"),
    "gi",
  );

  /**
   * ページ内の用語に下線用の span を付け、出てきた用語の番号を返す（同じ用語の下線はページで最初の1回だけ）。
   * @param {Element} section
   * @returns {number[]}
   */
  const markTerms = (section) => {
    const found = new Set();
    const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT, {
      acceptNode: (node) =>
        node.parentElement.closest("style, script, a, .ls-term") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    for (const node of nodes) {
      const text = node.nodeValue;
      const fragment = document.createDocumentFragment();
      let last = 0;
      for (const match of text.matchAll(pattern)) {
        const index = indexByName.get(match[0].toLowerCase());
        if (index === undefined || found.has(index)) continue;
        found.add(index);
        fragment.append(text.slice(last, match.index));
        const span = document.createElement("span");
        span.className = "ls-term";
        span.dataset.term = String(index);
        span.textContent = match[0];
        fragment.append(span);
        last = match.index + match[0].length;
      }
      if (last === 0) continue;
      fragment.append(text.slice(last));
      node.replaceWith(fragment);
    }
    return [...found];
  };

  const termsByPage = slides.map(markTerms);

  const style = document.createElement("style");
  // スライドのテーマ（story-slides）と同じ書体・配色にそろえる。書体は publish.sh が Web フォントで読み込む
  style.textContent = `
    .ls-term{text-decoration:underline dotted #2c63b4;text-decoration-thickness:.09em;text-underline-offset:.2em;cursor:pointer}
    .ls-gl-btn{position:fixed;right:12px;top:12px;z-index:2147483000;
      font:700 13px/1 "Zen Maru Gothic","Noto Sans JP","Hiragino Sans",sans-serif;letter-spacing:.04em;
      color:#fff;background:rgba(18,56,88,.82);border:0;padding:9px 14px;border-radius:999px;backdrop-filter:blur(6px);cursor:pointer}
    .ls-gl-sheet{position:fixed;left:0;right:0;bottom:0;z-index:2147483003;max-height:62vh;overflow:auto;
      background:#faf8f3;color:#17202a;border-radius:20px 20px 0 0;box-shadow:0 -10px 32px rgba(18,56,88,.22);
      padding:0 22px calc(28px + env(safe-area-inset-bottom));
      font:400 15px/1.85 "Noto Sans JP","Hiragino Sans",sans-serif;letter-spacing:.02em;
      font-feature-settings:"palt" 0;-webkit-font-smoothing:antialiased;text-wrap:pretty;word-break:auto-phrase}
    .ls-gl-head{position:sticky;top:0;display:flex;gap:8px;align-items:center;background:#faf8f3;padding:18px 0 12px;
      border-bottom:1px solid #d5dde6}
    .ls-gl-head::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;
      border-radius:2px;background:#d5dde6}
    .ls-gl-tab{border:1px solid #d5dde6;background:#fff;color:#65717e;border-radius:999px;padding:7px 14px;
      font:700 13px/1 "Zen Maru Gothic","Noto Sans JP",sans-serif;letter-spacing:.04em;cursor:pointer}
    .ls-gl-tab[aria-pressed="true"]{background:#2c63b4;border-color:#2c63b4;color:#fff}
    .ls-gl-close{margin-left:auto;border:0;background:none;font:400 24px/1 sans-serif;color:#65717e;cursor:pointer;padding:4px}
    .ls-gl-sheet dl{margin:0}
    .ls-gl-sheet dt{margin-top:18px;font:700 17px/1.4 "Zen Maru Gothic","Noto Sans JP",sans-serif;color:#123858;letter-spacing:.03em}
    .ls-gl-sheet dt::before{content:"";display:inline-block;width:4px;height:.95em;margin-right:8px;
      vertical-align:-.1em;border-radius:2px;background:#2c63b4}
    .ls-gl-sheet dd{margin:6px 0 0;padding-bottom:16px;border-bottom:1px solid #e7ebf0;color:#17202a}
    .ls-gl-sheet dd:last-child{border-bottom:0}
    .ls-gl-sheet .ls-gl-hit{background:linear-gradient(transparent 55%,#fbece7 55%);padding:0 2px}
  `;
  document.head.appendChild(style);

  const button = document.createElement("button");
  button.className = "ls-gl-btn";
  button.hidden = true;
  const sheet = document.createElement("div");
  sheet.className = "ls-gl-sheet";
  sheet.hidden = true;
  sheet.innerHTML = `<div class="ls-gl-head">
      <button class="ls-gl-tab" data-tab="page">このページ</button>
      <button class="ls-gl-tab" data-tab="all">すべての用語</button>
      <button class="ls-gl-close" aria-label="閉じる">×</button>
    </div><dl></dl>`;
  document.body.append(button, sheet);

  // シートやボタンの操作でスライドが送られないようにする（スワイプ・キー操作）
  for (const el of [button, sheet]) {
    for (const type of ["click", "touchstart", "touchmove", "touchend", "pointerdown", "pointerup", "keydown", "wheel"]) {
      el.addEventListener(type, (e) => e.stopPropagation());
    }
  }

  const currentPage = () => {
    const n = Number.parseInt(location.hash.slice(1), 10);
    return Number.isFinite(n) && n > 0 ? n : 1;
  };
  const pageTerms = () => termsByPage[currentPage() - 1] ?? [];

  let tab = "page";
  /**
   * 解説シートを描く。
   * @param {number | null} highlight 強調する用語の番号
   */
  const renderSheet = (highlight = null) => {
    const ids = tab === "page" ? pageTerms() : glossary.map((_, i) => i);
    for (const t of sheet.querySelectorAll(".ls-gl-tab")) t.setAttribute("aria-pressed", String(t.dataset.tab === tab));
    const dl = sheet.querySelector("dl");
    dl.replaceChildren();
    for (const i of ids) {
      const dt = document.createElement("dt");
      const name = document.createElement("span");
      name.textContent = glossary[i].term;
      if (i === highlight) name.className = "ls-gl-hit";
      dt.append(name);
      const dd = document.createElement("dd");
      dd.textContent = glossary[i].desc;
      dl.append(dt, dd);
      if (i === highlight) requestAnimationFrame(() => dt.scrollIntoView({ block: "nearest" }));
    }
    if (ids.length === 0) dl.innerHTML = '<dd style="margin-top:12px">このページに解説つきの用語はありません</dd>';
  };

  const renderButton = () => {
    const count = pageTerms().length;
    button.hidden = count === 0;
    button.textContent = `用語 ${count}`;
    if (!sheet.hidden && tab === "page") renderSheet();
  };

  button.addEventListener("click", () => {
    tab = "page";
    renderSheet();
    sheet.hidden = !sheet.hidden;
  });
  sheet.querySelector(".ls-gl-close").addEventListener("click", () => (sheet.hidden = true));
  for (const t of sheet.querySelectorAll(".ls-gl-tab")) {
    t.addEventListener("click", () => {
      tab = t.dataset.tab;
      renderSheet();
    });
  }

  document.addEventListener(
    "click",
    (e) => {
      const term = e.target instanceof Element && e.target.closest(".ls-term");
      if (!term) return;
      e.stopPropagation();
      tab = "page";
      renderSheet(Number(term.dataset.term));
      sheet.hidden = false;
    },
    true,
  );

  // Marp はページ送りで hashchange を出さずに URL を書き換えるので、URL も見に行く
  let last = currentPage();
  const check = () => {
    if (currentPage() === last) return;
    last = currentPage();
    renderButton();
  };
  window.addEventListener("hashchange", check);
  setInterval(check, 200);
  renderButton();
})();
</script><!-- live-sync:end --></body></html>
